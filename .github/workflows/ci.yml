name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Query-farm/vgi-actions/.github/workflows/ts-ci.yml@main

  # Metadata-quality gate (vgi-lint): scores the worker's catalog/schema/table/function
  # docs, tags, categories, per-arg docs, and examples, and fails on any finding at info
  # or above. execute:false keeps it deterministic — every governance function
  # (conditional_access_policies, role_assignments, app_credentials, and the two tables
  # that scan them) is credential-gated: it requires an app-only `azure_graph` secret
  # (tenant_id/client_id/client_secret) and a live Microsoft Graph call to return rows,
  # so the VGI9xx live-scan rules (VGI911 scan-responds, VGI920 agent-sim) cannot run
  # without tenant credentials. The LIMIT-0 executable bind-probes cover the static
  # surface. No version pin: @v1 resolves the latest published vgi-lint-check.
  lint:
    name: metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install worker dependencies
        run: bun install --frozen-lockfile
      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v1
        with:
          location: "bun run ${{ github.workspace }}/src/worker.ts"
          fail-on: info
          execute: "false"
